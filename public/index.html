const defaultTypes={labor:{name:'勞動部／勞工局還函',layout:'labor',suggestions:['重新招募函','入國引進許可函','聘僱許可函','廢止聘僱函','轉出函']},worker:{name:'工人文件',layout:'worker',suggestions:['接續聘僱證明書','轉出函','護照','居留證','聘僱函','體檢報告','工資切結書','勞動契約','大頭照']},employer:{name:'雇主文件',layout:'employer',suggestions:['工廠廠登/抄本','公司變更登記表','負責人身分證','勞資會議核備函','勞資代表名冊','求才證明書','無違反證明序號','印章(大小章)']}};

const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v&&Object.keys(v).length?v:deep(d)}catch{return deep(d)}};let templates=load('for-e-seal-templates-v1',defaultSeal),types=load('for-e-return-types-v1',defaultTypes);const saveSettings=()=>{localStorage.setItem('for-e-seal-templates-v1',JSON.stringify(templates));localStorage.setItem('for-e-return-types-v1',JSON.stringify(types))};
const makeSeal=()=>{let k=templates['其他']?'其他':Object.keys(templates)[0],t=templates[k];return {template:k,company:'',date:today(),urgency:'急件',deadline:'',returnMethod:'協助寄回用印文件（已附回郵）',purpose:t.purpose||'',unit:t.unit||'',handler:'',phone:'03-3577001',items:(t.items||[]).map(x=>({name:x[0]||'',qty:x[1]??1,remark:x[2]||''}))}};const makeReturn=()=>({type:Object.keys(types)[0],company:'',date:today(),businessManager:'',adminManager:'',adminHandler:'',receiver:'',receiveDate:'',items:[{name:'',copyType:'影本',docDate:'',docNo:'',worker:'',remark:''}]});const makeEscape=()=>({agency:'灃禾／灃康',language:'zh',employer:'',worker:'',passport:'',arc:'',detention:'',date:today(),handler:'',fax:'03-3577258',items:[{name:'費用明細表 (需確認簽名回傳)',qty:1,remark:''}]});
let initial=new URLSearchParams(location.search).get('view');if(!['seal','return','escape','history'].includes(initial))initial='seal';let S={view:initial,seal:makeSeal(),ret:makeReturn(),escape:makeEscape(),editing:null};
const title=()=>({seal:'用印申請明細',return:'客戶還函簽收單',escape:'逃跑簽收單',history:'歷史紀錄'})[S.view];const recs=()=>{try{return JSON.parse(localStorage.getItem('for-e-doc-system-v1')||'[]')}catch{return[]}};const setRecs=x=>localStorage.setItem('for-e-doc-system-v1',JSON.stringify(x));const toast=m=>{let d=document.createElement('div');d.className='toast';d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),1500)};
function shell(){let action=S.view==='history'?`<button class="btn" data-export>匯出 JSON</button><label class="btn">匯入 JSON<input id="imp" type="file" hidden accept="application/json"></label>`:`<button class="btn" data-reset>清空</button><button class="btn" data-save>儲存案件</button><button class="btn primary" data-print>列印 / PDF</button>`;return `<header class="head no-print"><div class="headin"><div class="brand"><div class="logo">F</div><div><b>FOR-e 文件管理</b><small>用印／還函／逃跑／信封列印</small></div></div><nav class="nav">${nav('seal','◎','用印申請明細')}${nav('return','▤','客戶還函簽收單')}${nav('escape','↪','逃跑簽收單')}<a href="/envelope.html">✉ 信封列印</a>${nav('history','◷','歷史紀錄')}</nav></div></header><div class="top no-print"><div><h2>${title()}</h2><small>文件申請、還函與簽收作業</small></div><div class="actions">${action}</div></div><main class="content">${view()}</main>`}function nav(v,i,t){return `<button class="${S.view===v?'active':''}" data-nav="${v}">${i} ${t}</button>`}
function field(l,id,v,type='text',full=''){return `<div class="field ${full}"><label>${l}</label><input id="${id}" type="${type}" value="${esc(v)}"></div>`}function select(l,id,opts,v,full=''){return `<div class="field ${full}"><label>${l}</label><select id="${id}">${opts.map(x=>{let a=Array.isArray(x)?x:[x,x];return `<option value="${esc(a[0])}" ${a[0]===v?'selected':''}>${esc(a[1])}</option>`}).join('')}</select></div>`}
function view(){if(S.view==='seal')return sealView();if(S.view==='return')return returnView();if(S.view==='escape')return escapeView();return historyView()}
function sealView(){let d=S.seal;return `<div class="grid"><section class="panel editor"><div class="ph"><h3>用印申請資料</h3><span class="tag">${esc(d.template)}</span></div><div class="pb"><div class="section"><div class="st">案件資料</div><div class="fg"><div class="field"><label>用途模板</label><div style="display:flex;gap:6px"><select id="seal-template" style="flex:1">${Object.keys(templates).map(k=>`<option ${k===d.template?'selected':''}>${esc(k)}</option>`).join('')}</select><button class="btn" data-manage-seal>管理</button></div></div>${field('日期','seal-date',d.date,'date')}${field('敬致／公司名稱','seal-company',d.company,'text','full')}${select('用印速別','seal-urgency',['急件','普通件'],d.urgency)}${field('用印期限','seal-deadline',d.deadline,'date')}${field('文件用途','seal-purpose',d.purpose)}${field('送件單位','seal-unit',d.unit)}${select('行政窗口','seal-handler',handlers,d.handler)}${field('電話','seal-phone',d.phone)}</div></div><div class="section"><div class="st">用印明細</div><div class="toolbar"><span class="hint">列印只顯示有內容的明細，不補空白格。</span><button class="btn" data-add="seal">＋新增一列</button></div>${sealTable()}</div></div></section><section class="panel"><div class="ph"><h3>列印預覽</h3></div><div class="preview">${sealPreview()}</div></section></div>`}
function sealTable(){return `<table class="et"><thead><tr><th>文件名稱</th><th style="width:80px">份數</th><th>備註</th><th style="width:50px"></th></tr></thead><tbody>${S.seal.items.map((r,i)=>`<tr><td><input data-si="name" data-i="${i}" value="${esc(r.name)}"></td><td><input data-si="qty" data-i="${i}" type="number" min="0" value="${esc(r.qty)}"></td><td><input data-si="remark" data-i="${i}" value="${esc(r.remark)}"></td><td><button class="btn danger" data-del="seal" data-i="${i}">刪</button></td></tr>`).join('')}</tbody></table>`}
function sealPreview(){let d=S.seal,rows=d.items.filter(r=>r.name.trim()||r.remark.trim());return `<div class="paper"><h1>用 印 申 請 書</h1><table class="dt"><tr><td class="label" style="width:22%">敬致</td><td>${esc(d.company)}</td><td class="label" style="width:17%">日期</td><td>${esc(d.date)}</td></tr><tr><td class="label">用印速別</td><td>${esc(d.urgency)}</td><td class="label">用印期限</td><td>${esc(d.deadline)}</td></tr><tr><td class="label">文件用途</td><td colspan="3">${esc(d.purpose)}</td></tr><tr><td class="label">送件單位</td><td colspan="3">${esc(d.unit)}</td></tr></table><h2>用 印 明 細</h2><table class="dt"><thead><tr><th>文件名稱</th><th style="width:12%">份數</th><th style="width:40%">備註</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td class="center">${esc(r.qty)}</td><td>${esc(r.remark)}</td></tr>`).join('')}</tbody></table><div class="note" style="margin-top:14px">行政窗口：${esc(d.handler)}　電話：${esc(d.phone)}</div></div>`}
function returnView(){let d=S.ret,t=types[d.type]||Object.values(types)[0];return `<div class="grid"><section class="panel editor"><div class="ph"><h3>簽收單內容</h3><span class="tag">${esc(t.name)}</span></div><div class="pb"><div class="section"><div class="st">基本資料</div><div class="fg"><div class="field"><label>簽收單類型</label><div style="display:flex;gap:6px"><select id="ret-type" style="flex:1">${Object.entries(types).map(([k,v])=>`<option value="${esc(k)}" ${k===d.type?'selected':''}>${esc(v.name)}</option>`).join('')}</select><button class="btn" data-manage-ret>管理</button></div></div>${field('提供日期','ret-date',d.date,'date')}${field('公司名稱','ret-company',d.company,'text','full')}${field('業務主管','ret-bm',d.businessManager)}${field('行政主管','ret-am',d.adminManager)}${select('行政承辦','ret-ah',handlers,d.adminHandler)}</div></div><div class="section"><div class="st">文件明細</div><div class="toolbar"><span class="hint">只輸入實際交付文件；沒有內容的列不會列印。</span><button class="btn" data-add="ret">＋新增一列</button></div>${returnTable()}</div></div></section><section class="panel"><div class="ph"><h3>列印預覽</h3></div><div class="preview">${returnPreview()}</div></section></div>`}
function returnTable(){let layout=(types[S.ret.type]||{}).layout||'labor';return `<table class="et"><thead><tr><th>文件名稱</th><th>發文日／外國人</th><th>發文字號</th><th>備註</th><th style="width:50px"></th></tr></thead><tbody>${S.ret.items.map((r,i)=>`<tr><td><input data-ri="name" data-i="${i}" value="${esc(r.name)}"></td><td><input data-ri="docDate" data-i="${i}" value="${esc(layout==='worker'?r.worker:r.docDate)}"></td><td><input data-ri="docNo" data-i="${i}" value="${esc(r.docNo)}"></td><td><input data-ri="remark" data-i="${i}" value="${esc(r.remark)}"></td><td><button class="btn danger" data-del="ret" data-i="${i}">刪</button></td></tr>`).join('')}</tbody></table>`}
function returnPreview(){let d=S.ret,t=types[d.type]||{},rows=d.items.filter(r=>r.name.trim()||r.docDate.trim()||r.docNo.trim()||r.worker.trim()||r.remark.trim()),worker=t.layout==='worker';return `<div class="paper"><h1>客戶還函簽收單</h1><table class="dt"><tr><td class="label" style="width:22%">公司名稱</td><td>${esc(d.company)}</td><td class="label" style="width:18%">提供日期</td><td>${esc(d.date)}</td></tr><tr><td class="label">簽收單類型</td><td colspan="3">${esc(t.name||'')}</td></tr></table><h2>交付文件明細</h2><table class="dt"><thead><tr><th>文件名稱</th><th>${worker?'外國人名字':'發文日'}</th>${worker?'':'<th>發文字號</th>'}<th>備註</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(worker?r.worker:r.docDate)}</td>${worker?'':`<td>${esc(r.docNo)}</td>`}<td>${esc(r.remark)}</td></tr>`).join('')}</tbody></table><table class="dt" style="margin-top:18px"><tr><td class="label">簽收人</td><td class="sign"></td><td class="label">簽收日期</td><td class="sign"></td></tr></table></div>`}
function escapeView(){let d=S.escape,L=lang[d.language];return `<div class="grid"><section class="panel editor"><div class="ph"><h3>逃跑簽收資料</h3><span class="tag">${esc(L.name)}</span></div><div class="pb"><div class="section"><div class="st">基本資料</div><div class="fg">${select('仲介公司','esc-agency',['灃禾／灃康','乾坤'],d.agency)}${select('語言版本','esc-lang',Object.entries(lang).map(([k,v])=>[k,v.name]),d.language)}${field('雇主名稱','esc-emp',d.employer,'text','full')}${field('工人姓名','esc-worker',d.worker)}${field('護照號碼','esc-pass',d.passport)}${field('居留證號','esc-arc',d.arc)}${field('收容編號','esc-det',d.detention)}${field('日期','esc-date',d.date,'date')}${field('仲介承辦人','esc-handler',d.handler)}${field('傳真','esc-fax',d.fax)}</div></div><div class="section"><div class="st">交付文件</div><div class="toolbar"><span class="hint">列印只顯示實際交付的文件。</span><button class="btn" data-add="escape">＋新增一列</button></div>${escapeTable()}</div></div></section><section class="panel"><div class="ph"><h3>列印預覽</h3></div><div class="preview">${escapePreview()}</div></section></div>`}
function escapeTable(){return `<table class="et"><thead><tr><th>文件內容</th><th style="width:80px">份數</th><th>備註</th><th style="width:50px"></th></tr></thead><tbody>${S.escape.items.map((r,i)=>`<tr><td><input data-ei="name" data-i="${i}" value="${esc(r.name)}"></td><td><input data-ei="qty" data-i="${i}" type="number" value="${esc(r.qty)}"></td><td><input data-ei="remark" data-i="${i}" value="${esc(r.remark)}"></td><td><button class="btn danger" data-del="escape" data-i="${i}">刪</button></td></tr>`).join('')}</tbody></table>`}
function escapePreview(){let d=S.escape,L=lang[d.language],rows=d.items.filter(r=>r.name.trim()||r.remark.trim());return `<div class="paper"><h1 style="white-space:pre-line">${esc(L.title)}</h1><table class="dt"><tr><td class="label">${esc(L.emp)}</td><td colspan="3">${esc(d.employer)}</td></tr><tr><td class="label">${esc(L.worker)}</td><td colspan="3">${esc(d.worker)}</td></tr><tr><td class="label">${esc(L.pass)}</td><td>${esc(d.passport)}</td><td class="label">${esc(L.arc)}</td><td>${esc(d.arc)}</td></tr><tr><td class="label">${esc(L.det)}</td><td>${esc(d.detention)}</td><td class="label">日期</td><td>${esc(d.date)}</td></tr></table><table class="dt" style="margin-top:10px"><thead><tr><th>${esc(L.item)}</th><th style="width:12%">${esc(L.qty)}</th><th>${esc(L.remark)}</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td class="center">${esc(r.qty)}</td><td>${esc(r.remark)}</td></tr>`).join('')}</tbody></table><div class="note" style="margin-top:10px">★ 請於拆封後先行清點內容物，確認無誤後再行簽名。<br>簽收完成後，請務必回傳簽收單。　傳真：${esc(d.fax)}　承辦：${esc(d.handler)}</div><table class="dt" style="margin-top:10px"><tr><td class="label">${esc(L.sign)}</td><td class="sign"></td><td class="label">${esc(L.date)}</td><td class="sign"></td></tr></table></div>`}
function historyView(){let r=recs();return `<section class="panel"><div class="ph"><h3>已儲存案件</h3><span class="hint">資料儲存在目前瀏覽器，可匯出備份。</span></div>${r.length?`<table class="history"><thead><tr><th>類型</th><th>客戶／雇主</th><th>內容</th><th>更新時間</th><th></th></tr></thead><tbody>${r.map(x=>`<tr><td><span class="tag">${x.type==='seal'?'用印申請':x.type==='return'?'客戶還函':'逃跑簽收'}</span></td><td>${esc(x.title)}</td><td>${esc(x.sub||'')}</td><td>${esc(x.time)}</td><td><button class="btn" data-load="${x.id}">開啟</button> <button class="btn danger" data-rm="${x.id}">刪除</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">目前沒有歷史案件</div>'}</section>`}
function bind(){$$('[data-nav]').forEach(b=>b.onclick=()=>{S.view=b.dataset.nav;S.editing=null;history.replaceState(null,'',S.view==='seal'?'./':`?view=${S.view}`);render()});let p=$('[data-print]');if(p)p.onclick=()=>print();let rr=$('[data-reset]');if(rr)rr.onclick=()=>{if(!confirm('確定清空目前表單？'))return;S.editing=null;if(S.view==='seal')S.seal=makeSeal();if(S.view==='return')S.ret=makeReturn();if(S.view==='escape')S.escape=makeEscape();render()};let sv=$('[data-save]');if(sv)sv.onclick=saveCase;let ex=$('[data-export]');if(ex)ex.onclick=exportJSON;let im=$('#imp');if(im)im.onchange=importJSON;if(S.view==='seal')bindSeal();if(S.view==='return')bindReturn();if(S.view==='escape')bindEscape();if(S.view==='history')bindHistory()}
function bindSeal(){let d=S.seal;$('#seal-template').onchange=e=>{let k=e.target.value,t=templates[k];d.template=k;d.purpose=t.purpose||'';d.unit=t.unit||'';d.items=(t.items||[]).map(x=>({name:x[0]||'',qty:x[1]??1,remark:x[2]||''}));render()};['company','date','urgency','deadline','purpose','unit','handler','phone'].forEach(k=>$('#seal-'+k)?.addEventListener('input',e=>{d[k]=e.target.value;refresh()}));$$('[data-si]').forEach(x=>x.oninput=e=>{let r=d.items[+x.dataset.i],k=x.dataset.si;r[k]=k==='qty'?+e.target.value:e.target.value;refresh()});bindRows('seal',d.items);$('[data-manage-seal]').onclick=()=>openSealManager()}
function bindReturn(){let d=S.ret;$('#ret-type').onchange=e=>{d.type=e.target.value;render()};[['date','date'],['company','company'],['bm','businessManager'],['am','adminManager'],['ah','adminHandler']].forEach(([id,k])=>$('#ret-'+id)?.addEventListener('input',e=>{d[k]=e.target.value;refresh()}));$$('[data-ri]').forEach(x=>x.oninput=e=>{let r=d.items[+x.dataset.i],k=x.dataset.ri;if(k==='docDate'&&(types[d.type]||{}).layout==='worker')r.worker=e.target.value;else r[k]=e.target.value;refresh()});bindRows('ret',d.items);$('[data-manage-ret]').onclick=()=>openRetManager()}
function bindEscape(){let d=S.escape;[['agency','agency'],['lang','language'],['emp','employer'],['worker','worker'],['pass','passport'],['arc','arc'],['det','detention'],['date','date'],['handler','handler'],['fax','fax']].forEach(([id,k])=>$('#esc-'+id)?.addEventListener('input',e=>{d[k]=e.target.value;if(k==='language')render();else refresh()}));$$('[data-ei]').forEach(x=>x.oninput=e=>{let r=d.items[+x.dataset.i],k=x.dataset.ei;r[k]=k==='qty'?+e.target.value:e.target.value;refresh()});bindRows('escape',d.items)}
function bindRows(type,arr){let a=$(`[data-add="${type}"]`);if(a)a.onclick=()=>{arr.push(type==='ret'?{name:'',copyType:'影本',docDate:'',docNo:'',worker:'',remark:''}:{name:'',qty:1,remark:''});render()};$$(`[data-del="${type}"]`).forEach(b=>b.onclick=()=>{arr.splice(+b.dataset.i,1);if(!arr.length)arr.push(type==='ret'?{name:'',copyType:'影本',docDate:'',docNo:'',worker:'',remark:''}:{name:'',qty:1,remark:''});render()})}
function refresh(){let p=$('.preview');if(!p)return;p.innerHTML=S.view==='seal'?sealPreview():S.view==='return'?returnPreview():escapePreview()}
function saveCase(){let type=S.view,data=deep(type==='seal'?S.seal:type==='return'?S.ret:S.escape),title=type==='seal'?data.company:type==='return'?data.company:data.employer,sub=type==='seal'?data.purpose:type==='return'?(types[data.type]?.name||''):data.worker,r=recs(),id=S.editing||String(Date.now()),rec={id,type,title:title||'未填',sub,time:new Date().toLocaleString('zh-TW',{hour12:false}),data},i=r.findIndex(x=>x.id===id);if(i>=0)r[i]=rec;else r.unshift(rec);setRecs(r);S.editing=id;toast('案件已儲存')}
function bindHistory(){$$('[data-load]').forEach(b=>b.onclick=()=>{let r=recs().find(x=>x.id===b.dataset.load);if(!r)return;S.editing=r.id;S.view=r.type;if(r.type==='seal')S.seal=deep(r.data);if(r.type==='return')S.ret=deep(r.data);if(r.type==='escape')S.escape=deep(r.data);render()});$$('[data-rm]').forEach(b=>b.onclick=()=>{if(confirm('確定刪除此案件？')){setRecs(recs().filter(x=>x.id!==b.dataset.rm));render()}})}
function exportJSON(){let a=document.createElement('a'),blob=new Blob([JSON.stringify(recs(),null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='FOR-e_文件管理備份_'+today().replaceAll('-','')+'.json';a.click();URL.revokeObjectURL(a.href)}function importJSON(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x))throw 0;setRecs(x);toast('匯入完成');render()}catch{alert('JSON 格式不正確')}};r.readAsText(f)}
function openSealManager(){let k=S.seal.template,t=templates[k]||{purpose:'',unit:'',items:[]};manager('管理用途模板',`<div class="manager"><div class="fg">${field('模板名稱','m-name',k)}${field('文件用途','m-purpose',t.purpose||'')}${field('送件單位','m-unit',t.unit||'','text','full')}</div><p class="hint">明細每行格式：文件名稱 | 份數 | 備註</p><textarea id="m-items">${esc((t.items||[]).map(x=>x.join(' | ')).join('\n'))}</textarea></div>`,`<button class="btn" id="m-new">新增模板</button><button class="btn danger" id="m-del">刪除模板</button>`,`<button class="btn" data-close>取消</button><button class="btn primary" id="m-save">儲存</button>`);$('#m-save').onclick=()=>{let n=$('#m-name').value.trim();if(!n)return alert('請輸入模板名稱');let v={purpose:$('#m-purpose').value.trim(),unit:$('#m-unit').value.trim(),items:parseItems($('#m-items').value)};if(n!==k)delete templates[k];templates[n]=v;saveSettings();S.seal.template=n;S.seal.purpose=v.purpose;S.seal.unit=v.unit;S.seal.items=v.items.map(x=>({name:x[0],qty:x[1],remark:x[2]}));closeModal();render();toast('模板已更新')};$('#m-new').onclick=()=>{let n=prompt('新模板名稱');if(!n)return;templates[n]={purpose:'',unit:'',items:[['',1,'']]};saveSettings();S.seal.template=n;closeModal();render();setTimeout(openSealManager)};$('#m-del').onclick=()=>{if(Object.keys(templates).length<=1)return alert('至少保留一個模板');if(confirm('確定刪除此模板？')){delete templates[k];saveSettings();S.seal=makeSeal();closeModal();render()}}}
function parseItems(s){return s.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{let a=x.split('|').map(v=>v.trim());return[a[0]||'',Number(a[1]||1),a[2]||'']})}
function openRetManager(){let k=S.ret.type,t=types[k]||{};manager('管理簽收單類型',`<div class="manager"><div class="fg">${field('類型名稱','r-name',t.name||k)}${select('明細格式','r-layout',[['labor','函文格式'],['worker','工人文件格式'],['employer','雇主文件格式']],t.layout||'labor','full')}</div><p class="hint">常用文件，每行一個：</p><textarea id="r-items">${esc((t.suggestions||[]).join('\n'))}</textarea></div>`,`<button class="btn" id="r-new">新增類型</button><button class="btn danger" id="r-del">刪除類型</button>`,`<button class="btn" data-close>取消</button><button class="btn primary" id="r-save">儲存</button>`);$('#r-save').onclick=()=>{let n=$('#r-name').value.trim();if(!n)return alert('請輸入類型名稱');let nk=n===t.name?k:n,v={name:n,layout:$('#r-layout').value,suggestions:$('#r-items').value.split('\n').map(x=>x.trim()).filter(Boolean)};if(nk!==k)delete types[k];types[nk]=v;saveSettings();S.ret.type=nk;closeModal();render();toast('類型已更新')};$('#r-new').onclick=()=>{let n=prompt('新類型名稱');if(!n)return;types[n]={name:n,layout:'labor',suggestions:[]};saveSettings();S.ret.type=n;closeModal();render();setTimeout(openRetManager)};$('#r-del').onclick=()=>{if(Object.keys(types).length<=1)return alert('至少保留一個類型');if(confirm('確定刪除此類型？')){delete types[k];saveSettings();S.ret.type=Object.keys(types)[0];closeModal();render()}}}
function manager(title,body,left,right){$('#modal').innerHTML=`<div class="modal"><div class="mc"><div class="mh"><b>${title}</b><button class="btn" data-close>×</button></div><div class="mb">${body}</div><div class="mf"><div>${left}</div><div>${right}</div></div></div></div>`;$$('[data-close]').forEach(x=>x.onclick=closeModal)}function closeModal(){$('#modal').innerHTML=''}
function render(){$('#app').innerHTML=shell();bind()}render();
</script></body></html>
