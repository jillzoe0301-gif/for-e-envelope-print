const sealTemplateStorageKey='for-e-seal-templates-v1';

function loadSettings(key,defaults){
  try{
    const v=JSON.parse(localStorage.getItem(key)||'null');
    return v && typeof v==='object' && !Array.isArray(v) && Object.keys(v).length ? v : deep(defaults);
  }catch{return deep(defaults)}
}
let sealTemplates=loadSettings(sealTemplateStorageKey,defaultSealTemplates);
let returnTypes=loadSettings(returnTypeStorageKey,defaultReturnTypes);
function saveSealTemplates(){localStorage.setItem(sealTemplateStorageKey,JSON.stringify(sealTemplates))}
function saveReturnTypes(){localStorage.setItem(returnTypeStorageKey,JSON.stringify(returnTypes))}
function firstReturnType(){return Object.keys(returnTypes)[0]||'labor'}
function returnTypeDef(key){return returnTypes[key]||{name:'客戶還函',layout:'labor',suggestions:[]}}
function applySealTemplate(key){
  const t=sealTemplates[key]; if(!t)return;
  state.seal.template=key;state.seal.purpose=t.purpose||'';state.seal.unit=t.unit||'';
  state.seal.items=(t.items||[]).map(x=>Array.isArray(x)?{name:x[0]||'',qty:x[1]??1,remark:x[2]||''}:{name:x.name||'',qty:x.qty??1,remark:x.remark||''});
  if(!state.seal.items.length)state.seal.items=[{name:'',qty:1,remark:''}];
}

function sealPreview(){const d=state.seal,items=d.items.filter(it=>String(it.name??'').trim()||String(it.remark??'').trim());return `<div class="paper"><div class="seal-logo">FOR-e DOCUMENT CONTROL</div><table class="doc-table seal-intro"><tr><td class="left-label center">敬　　致</td><td colspan="4">${esc(d.company)}</td></tr><tr><td class="left-label center">日　　期</td><td colspan="4">${esc(fmtDate(d.date))}</td></tr><tr><td class="left-label center">說　　明</td><td colspan="4">茲辦理外籍移工相關作業，相關文件需申請用印，麻煩您協助辦理，感謝您的幫忙。</td></tr><tr><td class="left-label center">用印速別</td><td colspan="4"><span class="pill">${d.urgency==='急件'?'✓ ':''}急件</span><span class="pill">${d.urgency==='普通件'?'✓ ':''}普通件</span></td></tr><tr><td class="left-label deadline-label center">用印期限</td><td>請於</td><td><b>${esc(fmtDate(d.deadline))}</b></td><td colspan="2">${esc(d.returnMethod)}</td></tr><tr><td class="left-label center">用印章樣</td><td colspan="4">${d.stamps.map(x=>`<span class="pill">✓ ${esc(x)}</span>`).join(' ')}</td></tr><tr><td class="left-label center">文件用途</td><td colspan="4">${esc(d.purpose)}</td></tr><tr><td class="left-label center">送件單位</td><td colspan="4">${esc(d.unit)}</td></tr><tr><td colspan="5" class="section-fill">用 印 明 細</td></tr></table><table class="doc-table seal-detail"><thead><tr><th>文件名稱</th><th style="width:11%">份數</th><th style="width:40%">備註</th></tr></thead><tbody>${items.map(it=>`<tr><td>${esc(it.name)}</td><td class="center">${esc(it.qty)}</td><td>${esc(it.remark)}</td></tr>`).join('')}</tbody></table><table class="doc-table seal-footer"><tr><td style="width:20%" class="label">行政窗口</td><td>${esc(d.handler)}</td><td style="width:13%" class="label">電話</td><td style="width:28%">${esc(d.phone)}</td></tr><tr><td colspan="4">若文件用印過程中有任何疑問，煩請來電與我們確認，謝謝您。</td></tr></table></div>`}

function fieldSelect(label,id,opts,val,extra=''){let options=(opts||[]).map(o=>Array.isArray(o)?o:[o,o]);if(val!==''&&val!=null&&!options.some(([v])=>String(v)===String(val)))options.unshift([val,val]);return `<div class="field ${extra}"><label for="${id}">${label}</label><select id="${id}">${options.length?options.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(val)?'selected':''}>${esc(t)}</option>`).join(''):`<option value="${esc(val||'')}">${esc(val||'尚未設定')}</option>`}</select></div>`}

function bindSeal(){$('#seal-template').onchange=e=>{applySealTemplate(e.target.value);app()};const manage=$('[data-manage-seal]');if(manage)manage.onclick=()=>openSealManager(state.seal.template);const map={"seal-date":'date','seal-company':'company','seal-urgency':'urgency','seal-deadline':'deadline','seal-return':'returnMethod','seal-purpose':'purpose','seal-unit':'unit','seal-handler':'handler','seal-phone':'phone'};Object.entries(map).forEach(([id,k])=>{const e=$('#'+id);e.oninput=()=>{state.seal[k]=e.value;refreshPreview()}});$$('[data-seal-stamp]').forEach(e=>e.onchange=()=>{const v=e.dataset.sealStamp;if(e.checked&&!state.seal.stamps.includes(v))state.seal.stamps.push(v);if(!e.checked)state.seal.stamps=state.seal.stamps.filter(x=>x!==v);refreshPreview()});$$('[data-seal-item]').forEach(e=>e.oninput=()=>{let v=e.value;if(e.dataset.sealItem==='qty')v=Number(v||0);state.seal.items[+e.dataset.i][e.dataset.sealItem]=v;refreshPreview()});$('[data-add="seal"]').onclick=()=>{state.seal.items.push({name:'',qty:1,remark:''});app()};$$('[data-del-seal]').forEach(b=>b.onclick=()=>{state.seal.items.splice(+b.dataset.delSeal,1);if(!state.seal.items.length)state.seal.items.push({name:'',qty:1,remark:''});app()})}
function openFieldOptionsManager(){const defs=[['handlers','行政／承辦人員','用於：用印行政窗口、還函行政承辦、逃跑仲介承辦人'],['stamps','印章類型／用印章樣','用印申請可複選；一行一個印章類型'],['urgencies','用印速別','例如：急件、普通件'],['returnMethods','文件回收方式','例如：寄回、派員取回、其他'],['agencies','仲介公司','逃跑簽收單的仲介公司選項'],['copyTypes','正／影本類型','客戶還函文件明細使用，例如：正本、影本、章樣']];const body=`<div class="manager-note">所有文字、日期、公司、用途、送件單位等欄位本來就可直接修改；以下是「選項型欄位」的共用清單。<b>一行一個選項</b>，可直接新增、改名或刪除，儲存後三個模組立即同步。</div><div class="option-grid">${defs.map(([k,t,h])=>`<div class="option-box"><h4>${t}</h4><div class="hint">${h}</div><textarea data-opt-key="${k}">${esc(optionList(k).join('\n'))}</textarea></div>`).join('')}</div>`;const foot=`<div class="left"><button class="btn" data-reset-options>恢復預設選項</button></div><div class="right"><button class="btn" data-close-manager-2>取消</button><button class="btn primary" data-save-options>儲存設定</button></div>`;const m=modalShell('欄位設定｜所有選項可新增・修改・刪除',body,foot,'','options');$('[data-close-manager-2]',m).onclick=closeManager;$('[data-save-options]',m).onclick=()=>{$$('[data-opt-key]',m).forEach(a=>{const vals=a.value.split('\n').map(x=>x.trim()).filter(Boolean);fieldOptions[a.dataset.optKey]=[...new Set(vals)]});saveFieldOptions();if(!optionList('agencies').includes(state.escape.agency))state.escape.agency=optionList('agencies')[0]||state.escape.agency;if(!optionList('handlers').includes(state.escape.handler)&&state.escape.handler==='')state.escape.handler=optionList('handlers')[0]||'';if(!optionList('handlers').includes(state.returnDoc.adminHandler)&&state.returnDoc.adminHandler==='')state.returnDoc.adminHandler=optionList('handlers')[0]||'';if(!optionList('handlers').includes(state.seal.handler)&&state.seal.handler==='')state.seal.handler=optionList('handlers')[0]||'';state.seal.stamps=(state.seal.stamps||[]).filter(x=>optionList('stamps').includes(x));if(!optionList('urgencies').includes(state.seal.urgency))state.seal.urgency=optionList('urgencies')[0]||state.seal.urgency;if(!optionList('returnMethods').includes(state.seal.returnMethod))state.seal.returnMethod=optionList('returnMethods')[0]||state.seal.returnMethod;closeManager();app();showToast('欄位選項已更新')};$('[data-reset-options]',m).onclick=()=>{if(!confirm('確定恢復所有預設選項？目前自訂選項會被覆蓋。'))return;fieldOptions=deep(defaultFieldOptions);saveFieldOptions();closeManager();app();showToast('已恢復預設選項')}}
function closeManager(){const m=$('.modal-backdrop');if(m)m.remove()}
function modalShell(title,body,foot,key,kind){const wrap=document.createElement('div');wrap.className='modal-backdrop';wrap.dataset.key=key||'';wrap.dataset.kind=kind||'';wrap.innerHTML=`<div class="modal-card" role="dialog" aria-modal="true"><div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" data-close-manager aria-label="關閉">×</button></div><div class="modal-body">${body}</div><div class="modal-foot">${foot}</div></div>`;wrap.addEventListener('click',e=>{if(e.target===wrap)closeManager()});document.body.appendChild(wrap);$('[data-close-manager]',wrap).onclick=closeManager;return wrap}
function openSealManager(key=state.seal.template){if(!sealTemplates[key])key=Object.keys(sealTemplates)[0];const t=deep(sealTemplates[key]||{purpose:'',unit:'',items:[]});const body=`<div class="manager-note">用途模板可以新增、改名、修改內容或刪除。選擇模板時會自動帶入文件用途、送件單位與明細；帶入後仍可在主表單自行調整。</div><div class="form-grid"><div class="field"><label>目前模板</label><select id="mgr-seal-select">${Object.keys(sealTemplates).map(k=>`<option value="${esc(k)}" ${k===key?'selected':''}>${esc(k)}</option>`).join('')}</select></div><div class="field"><label>模板名稱</label><input id="mgr-seal-name" value="${esc(key)}"></div><div class="field"><label>文件用途</label><input id="mgr-seal-purpose" value="${esc(t.purpose||'')}"></div><div class="field"><label>送件單位</label><input id="mgr-seal-unit" value="${esc(t.unit||'')}"></div></div><div class="manager-list"><div class="table-toolbar"><b>模板明細</b><button class="btn small" data-mgr-add-seal>＋新增一列</button></div><table class="edit-table" id="mgr-seal-table"><thead><tr><th>文件名稱</th><th style="width:90px">份數</th><th>備註</th><th style="width:55px"></th></tr></thead><tbody>${(t.items||[]).map(x=>{const a=Array.isArray(x)?x:[x.name,x.qty,x.remark];return `<tr><td><input data-mgr-seal="name" value="${esc(a[0]||'')}"></td><td><input type="number" min="0" data-mgr-seal="qty" value="${esc(a[1]??1)}"></td><td><input data-mgr-seal="remark" value="${esc(a[2]||'')}"></td><td><button class="btn small danger" data-mgr-del-row>刪</button></td></tr>`}).join('')}</tbody></table></div>`;const foot=`<div class="left"><button class="btn" data-mgr-new-seal>＋新增模板</button><button class="btn danger" data-mgr-delete-seal>刪除模板</button></div><div class="right"><button class="btn" data-close-manager-2>取消</button><button class="btn primary" data-mgr-save-seal>儲存模板</button></div>`;const m=modalShell('管理用途模板',body,foot,key,'seal');$('#mgr-seal-select',m).onchange=e=>{closeManager();openSealManager(e.target.value)};$('[data-close-manager-2]',m).onclick=closeManager;const tbody=$('#mgr-seal-table tbody',m),b lates)[0];if(state.seal.template===key)applySealTemplate(next);closeManager();app();showToast('模板已刪除')}}
function openReturnManager(key=state.returnDoc.type){if(!returnTypes[key])key=Object.keys(returnTypes)[0];const t=deep(returnTypes[key]||{name:'',layout:'labor',suggestions:[]});const body=`<div class="manager-note">類型可自行增刪。常用文件只會出現在輸入提示，不會自動列印；因此只有你實際填入「文件明細」的內容才會出現在簽收單上。</div><div class="form-grid"><div class="field"><label>目前類型</label><select id="mgr-ret-select">${Object.entries(returnTypes).map(([k,v])=>`<option value="${esc(k)}" ${k===key?'selected':''}>${esc(v.name)}</option>`).join('')}</select></div><div class="field"><label>類型名稱</label><input id="mgr-ret-name" value="${esc(t.name||key)}"></div><div class="field full"><label>明細格式</label><select id="mgr-ret-layout"><option value="labor" ${t.layout==='labor'?'selected':''}>函文格式｜發文日＋發文字號</option><option value="worker" ${t.layout==='worker'?'selected':''}>工人文件格式｜外國人名字</option><option value="employer" ${t.layout==='employer'?'selected':''}>雇主文件格式｜發文日＋字號＋雇主印章欄</option></select></div></div><div class="manager-list"><div class="table-toolbar"><b>常用文件選項</b><button class="btn small" data-mgr-add-ret>＋新增文件</button></div><table class="edit-table" id="mgr-ret-table"><thead><tr><th>文件名稱</th><th style="width:55px"></th></tr></thead><tbody>${(t.suggestions||[]).map(x=>`<tr><td><input data-mgr-ret-name value="${esc(x)}"></td><td><button class="btn small danger" data-mgr-del-ret-row>刪</button></td></tr>`).join('')}</tbody></table></div>`;const foot=`<div class="left"><button class="btn" data-mgr-new-ret>＋新增類型</button><button class="btn danger" data-mgr-delete-ret>刪除類型</button></div><div class="right"><button class="btn" data-close-manager-2>取消</button><button class="btn primary" data-mgr-save-ret>儲存類型</button></div>`;const m=modalShell('管理簽收單類型',body,foot,key,'return');$('#mgr-ret-select',m).onchange=e=>{closeManager();openReturnManager(e.target.value)};$('[data-close-manager-2]',m).onclick=closeManager;const tbody=$('#mgr-ret-table tbody',m),bindRows=()=>$$('[data-mgr-del-ret-row]',tbody).forEach(b=>b.onclick=()=>b.closest('tr').remove());bindRows();$('[data-mgr-add-ret]',m).onclick=()=>{tbody.insertAdjacentHTML('beforeend','<tr><td><input data-mgr-ret-name></td><td><button class="btn small danger" data-mgr-del-ret-row>刪</button></td></tr>');bindRows()};const collect=()=>({name:$('#mgr-ret-name',m).value.trim(),layout:$('#mgr-ret-layout',m).value,suggestions:$$('[data-mgr-ret-name]',tbody).map(x=>x.value.trim()).filter(Boolean)});$('[data-mgr-save-ret]',m).onclick=()=>{const v=collect(),old=m.dataset.key;if(!v.name){showToast('請輸入類型名稱','warn');return}let newKey=old;if(v.name!==returnTypeDef(old).name){newKey=v.name;if(returnTypes[newKey]&&newKey!==old){showToast('已有相同名稱的類型','warn');return}delete returnTypes[old]}returnTypes[newKey]={name:v.name,layout:v.layout,suggestions:v.suggestions};saveReturnTypes();if(state.returnDoc.type===old||state.returnDoc.type===newKey){state.returnDoc.type=newKey;state.returnDoc.layout=v.layout}closeManager();app();showToast('簽收單類型已更新')};$('[data-mgr-new-ret]',m).onclick=()=>{const base=collect(),name=prompt('請輸入新簽收單類型名稱：');if(!name||!name.trim())return;const n=name.trim();if(returnTypes[n]){showToast('已有相同名稱的類型','warn');return}returnTypes[n]={name:n,layout:base.layout,suggestions:[...base.suggestions]};saveReturnTypes();state.returnDoc.type=n;state.returnDoc.layout=base.layout;closeManager();app();setTimeout(()=>openReturnManager(n),0)};$('[data-mgr-delete-ret]',m).onclick=()=>{if(Object.keys(returnTypes).length<=1){showToast('至少要保留一個簽收單類型','warn');return}if(!confirm(`確定刪除「${returnTypeName(key)}」類型？`))return;delete returnTypes[key];saveReturnTypes();const next=Object.keys(returnTypes)[0];if(state.returnDoc.type===key){state.returnDoc.type=next;state.returnDoc.layout=returnTypeDef(next).layout||'labor'}closeManager();app();showToast('簽收單類型已刪除')}}
function refreshPreview(){const p=$('.preview-wrap');if(!p)return;if(state.view==='escape')p.innerHTML=escapePreview();if(state.view==='return')p.innerHTML=returnPreview();if(state.view==='seal')p.innerHTML=sealPreview()}
function saveCurrent(){const type=state.view==='return'?'return':state.view;const data=deep(type==='escape'?state.escape:type==='return'?state.returnDoc:state.seal);let title='',subtitle='';if(type==='escape'){title=data.employer||'未填雇主';subtitle=data.worker||''}if(type==='return'){title=data.company||'未填公司';subtitle=returnTypeName(data.type)}if(type==='seal'){title=data.company||'未填公司';subtitle=data.purpose||data.template}let list=getRecords();const rec={id:state.editingId||uid(),type,title,subtitle,updatedAt:new Date().toLocaleString('zh-TW',{hour12:false}),data};const i=list.findIndex(x=>x.id===rec.id);if(i>=0)list[i]=rec;else list.unshift(rec);setRecords(list);state.editingId=rec.id;showToast('案件已儲存')}
function history(){const rec=getRecords();return `<div class="panel"><div class="panel-head"><h3>已儲存案件</h3><span class="hint">資料目前儲存在這台瀏覽器，可匯出 JSON 備份。</span></div>${rec.length?`<table class="history-table"><thead><tr><th>類型</th><th>客戶／雇主</th><th>對象／用途</th><th>更新時間</th><th style="width:180px"></th></tr></thead><tbody>${rec.map(r=>`<tr><td><span class="tag">${moduleLabel(r.type)}</span></td><td>${esc(r.title)}</td><td>${esc(r.subtitle||'')}</td><td>${esc(r.updatedAt)}</td><td><button class="btn small" data-load="${r.id}">開啟</button> <button class="btn small danger" data-delete="${r.id}">刪除</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">目前沒有歷史案件</div>'}</div>`}
function bindHistory(){$$('[data-load]').forEach(b=>b.onclick=()=>{const r=getRecords().find(x=>x.id===b.dataset.load);if(!r)return;state.editingId=r.id;if(r.type==='escape'){state.escape=deep(r.data);state.view='escape'}if(r.type==='return'){state.returnDoc=deep(r.data);if(!state.returnDoc.layout)state.returnDoc.layout=returnTypeDef(state.returnDoc.type).layout||'labor';state.view='return'}if(r.type==='seal'){state.seal=deep(r.data);state.view='seal'}app()});$$('[data-delete]').forEach(b=>b.onclick=()=>{if(!confirm('確定刪除此案件？'))return;setRecords(getRecords().filter(x=>x.id!==b.dataset.delete));app()})}
function exportJSON(){const blob=new Blob([JSON.stringify(getRecords(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`FOR-e_文件管理備份_${today().replaceAll('-','')}.json`;a.click();URL.revokeObjectURL(a.href);showToast('已匯出備份')}
function importJSON(e){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const arr=JSON.parse(reader.result);if(!Array.isArray(arr))throw 0;setRecords(arr);showToast('匯入完成');app()}catch{showToast('JSON 格式不正確','warn')}};reader.readAsText(f,'utf-8')}
app();
  </script>
</body>
