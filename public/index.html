<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOR-e 文件／信封列印系統</title>
<link rel="icon" href="/favicon.ico">
<style>
html,body{margin:0;height:100%;background:#f4f6f8;font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif}.loading{height:100%;display:grid;place-items:center;color:#6b7280;font-size:14px}.loading-card{text-align:center;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:24px 30px;box-shadow:0 10px 28px rgba(31,41,55,.08)}.loading-card b{display:block;color:#374151;margin-bottom:6px}.loading-card small{color:#9ca3af}
</style>
</head>
<body><div class="loading"><div class="loading-card"><b>FOR-e 文件管理</b><div>系統載入中…</div><small>請稍候</small></div></div>
<script>
(async()=>{
  try{
    const parts=await Promise.all([0,1,2].map(async i=>{
      const r=await fetch(`/doc-bundle-${i}.txt`,{cache:'no-store'});
      if(!r.ok) throw new Error(`文件資料 ${i+1} 載入失敗`);
      return (await r.text()).trim();
    }));
    if(typeof DecompressionStream==='undefined') throw new Error('目前瀏覽器不支援系統解壓功能，請使用最新版 Chrome 或 Edge');
    const binary=atob(parts.join(''));
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    let html=await new Response(stream).text();
    const requested=new URLSearchParams(location.search).get('view');
    const view=['seal','return','escape','history'].includes(requested)?requested:'seal';
    html=html.replace('<title>FOR-e 文件簽收／用印管理系統</title>','<title>FOR-e 文件／信封列印系統</title>');
    html=html.replace('<small>簽收／用印管理系統</small>','<small>用印／還函／逃跑／信封列印</small>');
    html=html.replace("let state = {view:'seal', escape:blankEscape(), returnDoc:blankReturn(), seal:blankSeal(), editingId:null};",`let state = {view:'${view}', escape:blankEscape(), returnDoc:blankReturn(), seal:blankSeal(), editingId:null};`);
    html=html.replace(
      "<nav class=\"top-nav\">${navBtn('seal','◎','用印申請明細')}${navBtn('return','▤','客戶還函簽收單')}${navBtn('escape','↪','逃跑簽收單')}${navBtn('history','◷','歷史紀錄')}</nav>",
      "<nav class=\"top-nav\">${navBtn('seal','◎','用印申請明細')}${navBtn('return','▤','客戶還函簽收單')}${navBtn('escape','↪','逃跑簽收單')}<a class=\"nav-btn\" href=\"/envelope.html\"><span class=\"nav-icon\">✉</span>信封列印</a>${navBtn('history','◷','歷史紀錄')}</nav>"
    );
    document.open();document.write(html);document.close();
  }catch(err){
    console.error(err);
    document.body.innerHTML=`<div class="loading"><div class="loading-card"><b>文件管理系統載入失敗</b><div style="margin-bottom:10px">${String(err.message||err)}</div><button onclick="location.reload()" style="border:0;background:#ea7a1f;color:white;border-radius:8px;padding:8px 14px;cursor:pointer">重新載入</button></div></div>`;
  }
})();
</script>
</body>
</html>
